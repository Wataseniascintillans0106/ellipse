<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>flow check</title>
</head>
<body style="margin:0;background:#8a8a8a">
    <iframe id="frame" src="../index.html" style="width:390px;height:844px;border:0;display:block;background:#fff"></iframe>
    <pre id="out" style="position:fixed;right:0;top:0;background:#fff;font:10px/1.4 monospace;margin:0;padding:5px;width:225px;white-space:pre-wrap"></pre>
    <script>
        const log = [];
        const say = (m) => { log.push(m); document.getElementById('out').textContent = log.join('\n'); };
        const frame = document.getElementById('frame');
        const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

        frame.addEventListener('load', async () => {
            const w = frame.contentWindow, d = frame.contentDocument;
            const t = (label, cond, extra) => say((cond ? 'ok   ' : 'FAIL ') + label + (cond || !extra ? '' : ' -> ' + extra));
            const waitFor = async (sel, ms) => {
                for (let i = 0; i < (ms || 4000) / 50; i++) {
                    const hit = typeof sel === 'function' ? sel() : d.querySelector(sel);
                    if (hit) return hit;
                    await sleep(50);
                }
                return null;
            };
            const chordText = (sel) => Array.from(d.querySelectorAll(sel || '#viewPage'))
                .map((n) => n.textContent).join('\n');
            try {
                for (let i = 0; i < 60 && !d.querySelector('#rail .rail-item'); i++) await sleep(50);

                say('== 主页 ==');
                t('主页可见', !d.getElementById('viewHome').hidden);
                t('设置按钮在主页显示', !d.getElementById('settingsBtn').hidden);
                t('返回按钮隐藏', d.getElementById('backHomeBtn').hidden);

                const railItems = Array.from(d.querySelectorAll('#rail .rail-item'));
                t('竖栏四个入口（波状图 + 日历及健康 + 弦音 + 状态记录）', railItems.length === 4,
                    String(railItems.length));
                t('从上到下是波状图、日历及健康、弦音、状态记录',
                    railItems.length === 4 &&
                    railItems[0].getAttribute('data-rail-page') === 'trend' &&
                    railItems[1].getAttribute('data-rail-page') === 'calendar' &&
                    railItems[2].getAttribute('data-rail-page') === 'assistant' &&
                    railItems[3].getAttribute('data-act') === 'record');
                if (railItems.length === 4) {
                    const boxes = railItems.map((n) => n.getBoundingClientRect());
                    t('四个入口从上到下依次排开',
                        boxes[0].bottom <= boxes[1].top + 1 && boxes[1].bottom <= boxes[2].top + 1 &&
                        boxes[2].bottom <= boxes[3].top + 1,
                        boxes.map((b) => b.top + '~' + b.bottom).join(' / '));
                    t('四个入口一样大', boxes.every((b) => Math.abs(b.height - boxes[0].height) <= 1),
                        boxes.map((b) => b.height).join(' / '));
                }
                t('竖栏无导出按钮', !d.querySelector('#rail [data-act="export-sheet"]'));

                d.querySelector('#rail [data-act="record"]').click();
                await sleep(200);
                say('== 记录页 ==');
                t('hash=#record', w.location.hash === '#record');
                t('记录页可见', !d.getElementById('viewRecord').hidden);
                t('设置按钮仍隐藏', d.getElementById('settingsBtn').hidden);
                t('竖栏隐藏', d.getElementById('rail').hidden);
                t('返回按钮可见', !d.getElementById('backHomeBtn').hidden);

                t('页标题的字号是 25px',
                    parseFloat(w.getComputedStyle(d.querySelector('#viewRecord .head-line')).fontSize) === 25,
                    w.getComputedStyle(d.querySelector('#viewRecord .head-line')).fontSize);

                const recordHead = d.querySelector('#viewRecord .head-line').getBoundingClientRect();
                const recordHeadLeft = recordHead.left;
                const recordHeadTop = recordHead.top;

                const recordBack = d.getElementById('backHomeBtn').getBoundingClientRect();
                t('返回按钮在标题左边',
                    recordBack.right <= recordHead.left + 1,
                    recordBack.right + ' vs ' + recordHead.left);
                t('返回按钮和标题在同一行',
                    Math.abs(recordBack.top + recordBack.height / 2 -
                        (recordHead.top + recordHead.height / 2)) <= 2,
                    (recordBack.top + recordBack.height / 2) + ' vs ' +
                        (recordHead.top + recordHead.height / 2));
                t('返回按钮是页头里的按钮（不是浮在上面的圆形角标）',
                    !!d.querySelector('#viewRecord .head-row > #backHomeBtn'));

                const cards = Array.from(d.querySelectorAll('#moduleStack .module'));
                say('栏: ' + cards.map((c) => c.dataset.module).join(','));
                t('记录页最后一张是日记', cards.length > 0 &&
                    cards[cards.length - 1].dataset.module === 'diary');
                t('记录页里没有波状图卡片', cards.every((c) => c.dataset.module !== 'trend'));

                const offCenter = cards.filter((card) => {
                    const prev = card.querySelector('.module-preview');
                    if (!prev) return false;
                    const hr = card.querySelector('.module-head').getBoundingClientRect();
                    const pr = prev.getBoundingClientRect();
                    const cr = card.getBoundingClientRect();
                    const pcs = w.getComputedStyle(prev);
                    const border = parseFloat(w.getComputedStyle(card).borderBottomWidth) || 0;
                    const above = (pr.top + parseFloat(pcs.paddingTop)) - hr.bottom;
                    const below = (cr.bottom - border) - (pr.bottom - parseFloat(pcs.paddingBottom));
                    return Math.abs(above - below) > 1;
                }).map((c) => c.dataset.module);
                t('收起的小字上下留白一致（垂直居中）', offCenter.length === 0, offCenter.join(','));

                d.querySelector('.export-card').click();
                await sleep(300);
                d.getElementById('sheetClose').click();
                await sleep(400);
                t('面板自身关闭按钮有效', !d.getElementById('sheet').classList.contains('open'));

                const card = (id) => d.querySelector('.module[data-module="' + id + '"]');
                const isOpen = (id) => !!card(id) && card(id).classList.contains('is-open');
                const clickHead = (id) => card(id).querySelector('.module-head').click();

                const moodWas = isOpen('mood');
                clickHead('mood');
                await sleep(200);
                t('情绪栏点标题栏翻转展开状态', isOpen('mood') !== moodWas);
                clickHead('mood');
                await sleep(200);
                t('再点一次回到原状', isOpen('mood') === moodWas);

                say('== 波状图页（从主页竖栏进） ==');
                d.getElementById('backHomeBtn').click();
                await sleep(400);
                t('回到主页', !d.getElementById('viewHome').hidden);

                d.querySelector('#rail [data-rail-page="trend"]').click();
                await sleep(300);
                t('hash=#page/trend', w.location.hash === '#page/trend', w.location.hash);
                t('波状图页可见', !d.getElementById('viewPage').hidden);
                t('记录页已隐藏', d.getElementById('viewRecord').hidden);
                t('主页已隐藏', d.getElementById('viewHome').hidden);
                t('竖栏隐藏', d.getElementById('rail').hidden);
                t('返回按钮可见', !d.getElementById('backHomeBtn').hidden);
                t('设置按钮隐藏（设置只在主页）', d.getElementById('settingsBtn').hidden);

                const pageBody = d.getElementById('pageBody');
                t('标题是「状态波动图」', d.getElementById('pageTitle').textContent === '状态波动图',
                    d.getElementById('pageTitle').textContent);
                t('三个区间按钮', pageBody.querySelectorAll('.range-btn').length === 3);
                const charts = pageBody.querySelectorAll('.chart-block');
                t('出图 4 个模块', charts.length === 4);
                say('图: ' + Array.from(charts).map((c) => c.dataset.module + '(' +
                    c.querySelectorAll('svg').length + ')').join(' '));
                const moodSvgs = pageBody.querySelector('.chart-block[data-module="mood"]')
                    .querySelectorAll('svg').length;
                say('情绪 SVG 数=' + moodSvgs);
                t('情绪至少 3 张图', moodSvgs >= 3);
                t('最下面有一行小字说明', (d.getElementById('pageNote').textContent || '').length > 4,
                    d.getElementById('pageNote').textContent);

                const pageHead = d.getElementById('pageTitle').getBoundingClientRect();
                t('标题的左边缘和记录页标题对齐',
                    Math.abs(pageHead.left - recordHeadLeft) <= 1,
                    pageHead.left + ' vs ' + recordHeadLeft);
                t('标题的顶边和记录页标题对齐（同样的顶部留白）',
                    Math.abs(pageHead.top - recordHeadTop) <= 1,
                    pageHead.top + ' vs ' + recordHeadTop);

                const rangeRow = pageBody.querySelector('.range-row').getBoundingClientRect();
                const lastChart = charts[charts.length - 1].getBoundingClientRect();
                const noteRect = d.getElementById('pageNote').getBoundingClientRect();
                t('区间按钮排在标题下面', rangeRow.top >= pageHead.bottom - 1,
                    rangeRow.top + ' vs ' + pageHead.bottom);
                t('小字排在所有图的下面', noteRect.top >= lastChart.bottom - 1,
                    noteRect.top + ' vs ' + lastChart.bottom);
                const firstChart = charts[0].getBoundingClientRect();
                t('曲线块与区间按钮左右对齐',
                    Math.abs(firstChart.left - rangeRow.left) <= 1,
                    firstChart.left + ' vs ' + rangeRow.left);
                t('返回按钮在这一页也在标题左边、同一行',
                    d.getElementById('backHomeBtn').getBoundingClientRect().right <= pageHead.left + 1 &&
                    Math.abs(d.getElementById('backHomeBtn').getBoundingClientRect().top +
                        d.getElementById('backHomeBtn').getBoundingClientRect().height / 2 -
                        (pageHead.top + pageHead.height / 2)) <= 2);

                t('这一页比一屏高、能上下滑',
                    d.getElementById('viewPage').scrollHeight > w.innerHeight,
                    d.getElementById('viewPage').scrollHeight + ' vs ' + w.innerHeight);

                const beforeRange = pageBody.querySelector('.range-btn.on').textContent;
                pageBody.querySelectorAll('.range-btn')[0].click();
                await sleep(200);
                t('点区间按钮后选中态跟着切',
                    pageBody.querySelector('.range-btn.on').textContent !== beforeRange,
                    beforeRange + ' -> ' + pageBody.querySelector('.range-btn.on').textContent);
                t('切完还是同一个页面', !d.getElementById('viewPage').hidden);

                d.getElementById('backHomeBtn').click();
                await sleep(400);
                t('从波状图页返回主页', !d.getElementById('viewHome').hidden);

                say('== 导出面板 ==');
                d.querySelector('#rail [data-act="record"]').click();
                await sleep(300);
                d.querySelector('.export-card').click();
                await sleep(300);
                t('面板已打开', d.getElementById('sheet').classList.contains('open'));
                t('返回按钮让位隐藏', d.getElementById('backHomeBtn').hidden);
                t('body 锁定', d.body.classList.contains('is-locked'));
                d.getElementById('backHomeBtn').click();
                await sleep(400);
                t('面板自身关闭按钮有效', !d.getElementById('sheet').classList.contains('open'));
                t('关闭后返回按钮恢复', !d.getElementById('backHomeBtn').hidden);
                t('仍在记录页', !d.getElementById('viewRecord').hidden);

                d.querySelector('.export-card').click();
                await sleep(300);
                d.getElementById('backHomeBtn').click();
                await sleep(300);
                d.getElementById('backHomeBtn').click();
                await sleep(400);
                t('再点返回回到主页', !d.getElementById('viewHome').hidden);
                t('主页上设置按钮恢复', !d.getElementById('settingsBtn').hidden);

                say('== 设置里挪主页栏的顺序 ==');
                d.getElementById('settingsBtn').click();
                await sleep(200);
                const orderRow = d.querySelector('[data-rail-order-row]');
                t('设置里有主页栏顺序这一块', !!orderRow);
                const railRows = Array.from(orderRow.querySelectorAll('[data-rail-item]'));
                t('四个入口各占一行、顺序和竖栏一致',
                    railRows.map((n) => n.getAttribute('data-rail-item')).join(',') ===
                    'trend,calendar,assistant,record',
                    railRows.map((n) => n.getAttribute('data-rail-item')).join(','));
                t('每行都能往上往下挪',
                    railRows.every((n) => n.querySelectorAll('[data-rail-move]').length === 2));
                t('第一行不能上移、最后一行不能下移',
                    railRows[0].querySelector('[data-rail-move="up"]').disabled &&
                    railRows[railRows.length - 1].querySelector('[data-rail-move="down"]').disabled);
                t('中间那两行两头都能挪',
                    !railRows[1].querySelector('[data-rail-move="up"]').disabled &&
                    !railRows[1].querySelector('[data-rail-move="down"]').disabled);

                say('== 设置里谁住哪一折 ==');
                const foldTitles = Array.from(
                    d.querySelectorAll('#settingsBody .set-group--fold .set-group-title')
                ).map((n) => n.textContent.trim());
                say('折子: ' + foldTitles.join(' / '));
                t('弦音那一折的标题加了 AI 前缀',
                    foldTitles.indexOf('AI——弦音') >= 0, foldTitles.join(','));
                const railFold = orderRow.closest('[data-group]');
                t('主页栏顺序这一块挪进了弦音那一折',
                    !!railFold && railFold.getAttribute('data-group') === 'assistant',
                    railFold ? railFold.getAttribute('data-group') : '（没挂在任何一折里）');
                t('波状图那个默认区间住进了「数值图」这一折',
                    !!d.querySelector('#settingsBody [data-group="chart"] [data-default-range]'));
                // 「模块」那一大块本身也是 .set-group，撇开它，剩下的才是单占一节的
                const looseTitles = Array.from(
                    d.querySelectorAll('#settingsBody > .set-group > .set-group-head > .set-group-title')
                ).map((n) => n.textContent.trim()).slice(1);
                say('单占一节的: ' + looseTitles.join(' / '));
                t('「显示」不再单独占一节', looseTitles.indexOf('显示') < 0, looseTitles.join(','));
                t('填接口那一节还叫「AI——弦音」',
                    looseTitles.indexOf('AI——弦音') >= 0, looseTitles.join(','));

                railRows[2].querySelector('[data-rail-move="up"]').click();
                await sleep(200);
                const afterRows = Array.from(d.querySelectorAll('[data-rail-order-row] [data-rail-item]'));
                t('点完「上移」，设置里弦音就跑到日历前面',
                    afterRows.map((n) => n.getAttribute('data-rail-item')).join(',') ===
                    'trend,assistant,calendar,record',
                    afterRows.map((n) => n.getAttribute('data-rail-item')).join(','));
                d.getElementById('settingsClose').click();
                await sleep(250);
                const railAfter = Array.from(d.querySelectorAll('#rail .rail-item'));
                t('回主页，竖栏里弦音真的上去了',
                    railAfter.length === 4 &&
                    railAfter[0].getAttribute('data-rail-page') === 'trend' &&
                    railAfter[1].getAttribute('data-rail-page') === 'assistant' &&
                    railAfter[2].getAttribute('data-rail-page') === 'calendar' &&
                    railAfter[3].getAttribute('data-act') === 'record');
                if (railAfter.length === 4) {
                    const boxes = railAfter.map((n) => n.getBoundingClientRect());
                    t('画出来也是这个顺序',
                        boxes[0].bottom <= boxes[1].top + 1 && boxes[1].bottom <= boxes[2].top + 1 &&
                        boxes[2].bottom <= boxes[3].top + 1,
                        boxes.map((b) => b.top + '~' + b.bottom).join(' / '));
                }
                t('这个顺序存进设置里了',
                    JSON.parse(w.localStorage.getItem('ellipse.v1.settings')).ui.railOrder.join(',') ===
                    'trend,assistant,calendar,record');

                d.getElementById('settingsBtn').click();
                await sleep(200);
                d.querySelector('[data-rail-item="assistant"] [data-rail-move="down"]').click();
                await sleep(200);
                d.getElementById('settingsClose').click();
                await sleep(250);
                const railBack = Array.from(d.querySelectorAll('#rail .rail-item'));
                t('再挪回来，顺序又回到波状图、日历、弦音、状态记录',
                    railBack.length === 4 &&
                    railBack[0].getAttribute('data-rail-page') === 'trend' &&
                    railBack[1].getAttribute('data-rail-page') === 'calendar' &&
                    railBack[2].getAttribute('data-rail-page') === 'assistant' &&
                    railBack[3].getAttribute('data-act') === 'record');
                if (railBack.length === 4) {
                    const boxes = railBack.map((n) => n.getBoundingClientRect());
                    t('画出来也回到原位',
                        boxes[0].bottom <= boxes[1].top + 1 && boxes[1].bottom <= boxes[2].top + 1 &&
                        boxes[2].bottom <= boxes[3].top + 1,
                        boxes.map((b) => b.top + '~' + b.bottom).join(' / '));
                }

                say('== 设置里关闭波状图 ==');
                d.getElementById('settingsBtn').click();
                await sleep(200);
                const trendRow = d.querySelector('[data-module-row="trend"] [data-toggle]');
                t('设置里有波状图开关', !!trendRow);
                t('页面型模块不给排序按钮，也说明了入口在哪',
                    d.querySelectorAll('[data-module-row="trend"] [data-order]').length === 0 &&
                    /入口在主页右侧栏/.test(
                        d.querySelector('[data-module-row="trend"] .set-row-desc').textContent));
                trendRow.click();
                await sleep(200);
                d.getElementById('settingsClose').click();
                await sleep(250);
                t('关掉后竖栏里的波状图入口消失',
                    !d.querySelector('#rail [data-rail-page="trend"]'));
                t('状态记录入口还在', !!d.querySelector('#rail [data-act="record"]'));

                say('== 关掉「状态记录」栏全部模块 ==');
                d.getElementById('settingsBtn').click();
                await sleep(200);
                const cardIds = Array.from(
                    d.querySelectorAll('#settingsBody [data-group="record"] [data-toggle]'))
                    .map((b) => b.getAttribute('data-toggle'));
                say('要关的卡片: ' + cardIds.join(','));
                t('「状态记录」栏里有模块可关', cardIds.length > 0);
                for (const id of cardIds) {
                    d.querySelector('[data-module-row="' + id + '"] [data-toggle]').click();
                    await sleep(150);
                }
                t('关到最后，竖栏里「状态记录」入口消失',
                    !d.querySelector('#rail [data-act="record"]'));
                t('波状图那一栏之前已经关掉了，这会儿只剩日历入口',
                    !!d.querySelector('#rail [data-rail-page="calendar"]'));
                t('它们还在设置里，能再打开',
                    !!d.querySelector('[data-module-row="' + cardIds[0] + '"] [data-toggle]'));

                d.querySelector('[data-module-row="' + cardIds[0] + '"] [data-toggle]').click();
                await sleep(150);
                d.getElementById('settingsClose').click();
                await sleep(250);
                t('重新打开任意一个，「状态记录」入口就回来',
                    !!d.querySelector('#rail [data-act="record"]'));
                t('竖栏重新露出来', !d.getElementById('rail').hidden);

                say('== 「状态记录」栏的标题条仍能收起 / 展开 ==');
                d.getElementById('settingsBtn').click();
                await sleep(250);
                const foldBtn = () => d.querySelector('[data-fold="record"]');
                const foldBody = () => d.querySelector('[data-group="record"] .set-group-body');
                t('标题条上还是那个折叠按钮', !!foldBtn());
                t('折叠按钮没把总开关裹进去（不能是嵌套按钮）',
                    !!foldBtn() && foldBtn().querySelectorAll('button').length === 0);
                t('默认展开着', !!foldBody() && !foldBody().hidden);

                foldBtn().click();
                await sleep(250);
                t('点标题条那一栏收起', !!foldBody() && foldBody().hidden);

                d.getElementById('settingsClose').click();
                await sleep(250);
                d.getElementById('settingsBtn').click();
                await sleep(250);
                t('关掉设置再打开，收起状态还在', !!foldBody() && foldBody().hidden);

                foldBtn().click();
                await sleep(250);
                t('再点一次又展开', !!foldBody() && !foldBody().hidden);
                d.getElementById('settingsClose').click();
                await sleep(250);

                say('== 「状态记录」栏的总开关 ==');
                d.getElementById('settingsBtn').click();
                await sleep(250);
                const master = () => d.querySelector('[data-toggle-group="record"]');
                const cardSwitches = () => d.querySelectorAll(
                    '#settingsBody [data-group="record"] [data-toggle]');
                const cardOnCount = () => d.querySelectorAll(
                    '#settingsBody [data-group="record"] [data-toggle].on').length;
                t('「状态记录」栏标题条上有一个总开关', !!master());
                t('现在只开着一个，总开关显示「关」',
                    cardOnCount() === 1 && !!master() && !master().classList.contains('on'));

                master().click();
                await sleep(250);
                t('点一下整栏全开', cardSwitches().length > 1 &&
                    cardOnCount() === cardSwitches().length, String(cardOnCount()));
                t('总开关自己变成「开」', !!master() && master().classList.contains('on'));

                master().click();
                await sleep(250);
                t('再点一下整栏全关', cardOnCount() === 0, String(cardOnCount()));
                t('总开关自己变成「关」', !!master() && !master().classList.contains('on'));

                d.getElementById('settingsClose').click();
                await sleep(250);
                t('整栏关光后竖栏里的「状态记录」入口又没了',
                    !d.querySelector('#rail [data-act="record"]'));
                t('日历入口还在，竖栏就不收起',
                    !!d.querySelector('#rail [data-rail-page="calendar"]') && !d.getElementById('rail').hidden);

                d.getElementById('settingsBtn').click();
                await sleep(250);
                master().click();
                await sleep(250);
                d.getElementById('settingsClose').click();
                await sleep(250);
                t('用总开关打开，入口就回来', !!d.querySelector('#rail [data-act="record"]'));
                t('竖栏重新露出来', !d.getElementById('rail').hidden);
                say('== 日历及健康页（从主页竖栏进） ==');
                d.querySelector('#rail [data-rail-page="calendar"]').click();
                await sleep(350);
                t('hash=#page/calendar', w.location.hash === '#page/calendar', w.location.hash);
                t('日历页可见', !d.getElementById('viewPage').hidden);
                t('标题是「日历及健康」', d.getElementById('pageTitle').textContent === '日历及健康',
                    d.getElementById('pageTitle').textContent);
                t('整页模块的标题也是 25px（和记录页一样大）',
                    parseFloat(w.getComputedStyle(d.getElementById('pageTitle')).fontSize) === 25,
                    w.getComputedStyle(d.getElementById('pageTitle')).fontSize);
                t('返回按钮跟别的一样在左边', !!d.querySelector('#viewPage .head-row > #backHomeBtn'));

                const calBody = d.getElementById('pageBody');
                const calHeadRow = d.querySelector('#viewPage .head-row');
                const searchBtn = calHeadRow.querySelector('[data-cal="search"]');
                t('右上角有搜索按钮', !!searchBtn);
                t('搜索按钮贴在页头右边',
                    !!searchBtn && searchBtn.getBoundingClientRect().right >=
                        calHeadRow.getBoundingClientRect().right - 6,
                    searchBtn ? searchBtn.getBoundingClientRect().right + ' vs ' +
                        calHeadRow.getBoundingClientRect().right : '');

                t('读取开关关着时，卡上说清楚去哪儿开',
                    /设置 · AI——弦音/.test(chordText('#viewPage .chord-card-done')));
                t('只花了拿到回话的那一次，没再为读记录多花一次',
                    asks === asksBeforeRead + 1, asks + ' / ' + (asksBeforeRead + 1));

                say('== 弦音：打开开关、勾「以后不用再问」，才真能读到 ==');
                let sawDigest = false;
                w.fetch = function (url, opts) {
                    asks++;
                    if (String(url).indexOf('chat/completions') < 0) return realFetch.apply(w, arguments);
                    if (String((opts && opts.body) || '').indexOf('【用户已同意你查看的记录】') >= 0) {
                        sawDigest = true;
                        return Promise.resolve(sse([parcel('看过了，这几天睡得还行。')]));
                    }
                    return Promise.resolve(sse([parcel('我看看。\n\n```ellipse\n' +
                        JSON.stringify({ do: [{ act: 'read-records', from: day, to: day, modules: ['sleep'] }] }) +
                        '\n```')]));
                };

                w.ellipse.settings.set('assistant', { readAllow: true });
                await sleep(200);
                typeIn('我最近睡得怎么样');
                await waitFor(() => d.querySelector('#viewPage [data-chord="trust"]'));
                t('开关打开后，卡上多出「以后不用再问」',
                    !!d.querySelector('#viewPage [data-chord="trust"]'));
                d.querySelector('#viewPage [data-chord="trust"]').checked = true;
                d.querySelector('#viewPage [data-chord="yes"]').click();
                await waitFor(() => /睡得还行/.test(chordText('#viewPage .chord-bubble')));
                t('点同意后记录真的发过去了', sawDigest);
                t('拿到记录后弦音接着说下去',
                    /睡得还行/.test(chordText('#viewPage .chord-bubble')),
                    chordText('#viewPage .chord-bubble'));
                t('「以后不用再问」被记住了',
                    String(w.ellipse.settings.get('assistant').readTrusted) === 'sleep',
                    String(w.ellipse.settings.get('assistant').readTrusted));

                say('== 弦音：不想活了，本地拦下，不发给 AI ==');
                const asksBeforeCrisis = asks;
                typeIn('我不想活了');
                await sleep(300);
                t('出了求助卡', !!d.querySelector('#viewPage .chord-card--crisis'));
                t('求助卡上有热线和急救',
                    /12356/.test((d.querySelector('#viewPage .chord-card--crisis') || {}).textContent || '') &&
                    /120/.test((d.querySelector('#viewPage .chord-card--crisis') || {}).textContent || ''));
                t('一个字都没发给 AI', asks === asksBeforeCrisis,
                    asks + ' / ' + asksBeforeCrisis);
                w.fetch = realFetch;

                say('== 弦音：贴一张照片发给 AI ==');
                const chatH = w.document.documentElement.style.getPropertyValue('--chat-h');
                t('量了真实可视高度写进 --chat-h（软键盘要靠它）',
                    /^\d+px$/.test(chatH.trim()), chatH);

                const attachBox = () => d.querySelector('#viewPage #chordAttach');
                const makeFile = (name, ww, hh) => new Promise((res) => {
                    const cv = d.createElement('canvas');
                    cv.width = ww;
                    cv.height = hh;
                    const ctx = cv.getContext('2d');
                    ctx.fillStyle = '#3fa07a';
                    ctx.fillRect(0, 0, ww, hh);
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(ww / 4, hh / 4, ww / 2, hh / 2);
                    cv.toBlob((blob) => res(new w.File([blob], name, { type: 'image/png' })), 'image/png');
                });
                const feed = (file) => {
                    const dt = new w.DataTransfer();
                    dt.items.add(file);
                    const input = d.getElementById('chordFile');
                    input.files = dt.files;
                    input.dispatchEvent(new w.Event('change', { bubbles: true }));
                };

                let sentBody = '';
                w.fetch = function (url, opts) {
                    asks++;
                    if (String(url).indexOf('chat/completions') < 0) return realFetch.apply(w, arguments);
                    sentBody = String((opts && opts.body) || '');
                    return Promise.resolve(sse([parcel('我看到了，绿底、中间一块白。')]));
                };
                const lastMsg = () => {
                    const arr = JSON.parse(sentBody).messages;
                    return arr[arr.length - 1];
                };

                // 无头浏览器里 createImageBitmap 永远不返回（虚拟时钟不推图片解码），
                // 摘掉它，逼 app 走自己那条 <img> 兜底路——两条路只差一次解码，后面都一样。
                w.createImageBitmap = undefined;

                feed(await makeFile('wo.png', 1400, 1000));
                const shown = await waitFor(() => {
                    const b = attachBox();
                    return b && !b.hidden && b.querySelector('img') ? b : null;
                });
                t('选完照片，输入条上方露出预览', !!shown);
                t('预览里已经缩成 JPEG（不是原来那张 PNG）',
                    !!shown && /^data:image\/jpeg/.test(shown.querySelector('img').src),
                    shown ? String(shown.querySelector('img').src).slice(0, 24) : '');

                d.querySelector('#viewPage [data-chord="drop-photo"]').click();
                await sleep(150);
                t('点「去掉」预览就收起来', attachBox().hidden === true);

                feed(await makeFile('wo.png', 1400, 1000));
                await waitFor(() => attachBox() && !attachBox().hidden && attachBox().querySelector('img'));
                d.getElementById('chordSend').click();
                await waitFor(() => /绿底/.test(chordText('#viewPage .chord-bubble')));
                t('不打字、只发照片也发得出去',
                    /绿底/.test(chordText('#viewPage .chord-bubble')), chordText('#viewPage .chord-bubble'));
                t('发完预览条就收起来了', attachBox().hidden === true);
                t('气泡里画出了那张照片', !!d.querySelector('#viewPage .chord-msg--me .chord-pic-img'));
                t('点气泡里的照片，弹出来看大图', (function () {
                    const pic = d.querySelector('#viewPage .chord-pic-img');
                    if (!pic) return false;
                    pic.click();
                    return d.getElementById('sheet').classList.contains('open') &&
                        !!d.querySelector('#sheetBody .chord-view-img');
                })());
                d.getElementById('sheetClose').click();
                await sleep(200);
                t('看完大图能关掉', !d.getElementById('sheet').classList.contains('open'));

                const outMsg = lastMsg();
                t('只发照片时，「内容」是数组、里面只有图片段（没塞空的文字段）',
                    Array.isArray(outMsg.content) && outMsg.content.length === 1 &&
                    outMsg.content[0].type === 'image_url',
                    JSON.stringify(outMsg).slice(0, 120));
                t('请求体里那串图确实是张 JPEG',
                    String(outMsg.content[0].image_url.url).indexOf('data:image/jpeg') === 0);

                const stored = JSON.parse(w.localStorage.getItem('ellipse.v1.settings'))
                    .mods.assistant.chat;
                const mine = stored.filter((m) => m.role === 'user').pop();
                t('存本机的那条有照片', !!(mine && mine.photo));
                t('那张临时清楚图没有落盘', !!mine && mine.photoSend === undefined,
                    JSON.stringify(mine || {}).slice(0, 80));
                t('发给 AI 的比存本机的清楚',
                    mine && mine.photo &&
                    outMsg.content[0].image_url.url.length > mine.photo.length,
                    (mine && mine.photo ? mine.photo.length : 0) + ' / ' +
                    outMsg.content[0].image_url.url.length);
                t('气泡里那张就是存本机那张（不是临时那张清楚图）',
                    !!mine && !!mine.photo &&
                    d.querySelector('#viewPage .chord-pic-img').getAttribute('src') === mine.photo);

                sentBody = '';
                typeIn('今天挺好的');
                await waitFor(() => sentBody.indexOf('今天挺好的') >= 0);
                t('纯文字那条还是普通字符串，没硬塞图片段',
                    typeof lastMsg().content === 'string' && lastMsg().content === '今天挺好的',
                    JSON.stringify(lastMsg()).slice(0, 120));

                sentBody = '';
                feed(await makeFile('wo.png', 1400, 1000));
                await waitFor(() => attachBox() && !attachBox().hidden && attachBox().querySelector('img'));
                typeIn('看看这张');
                await waitFor(() => sentBody.indexOf('看看这张') >= 0);
                t('又打字又贴图：文字段排在前、图片段排在后', (function () {
                    const c = lastMsg().content;
                    return Array.isArray(c) && c.length === 2 &&
                        c[0].type === 'text' && c[0].text === '看看这张' &&
                        c[1].type === 'image_url';
                })(), JSON.stringify(lastMsg()).slice(0, 160));

                say('== 弦音：哪个模型看不了图，要说人话 ==');
                w.fetch = function (url, opts) {
                    asks++;
                    if (String(url).indexOf('chat/completions') < 0) return realFetch.apply(w, arguments);
                    return Promise.resolve(new w.Response(
                        JSON.stringify({ error: { message: 'invalid content type' } }),
                        { status: 400, headers: { 'Content-Type': 'application/json' } }
                    ));
                };
                feed(await makeFile('wo.png', 1400, 1000));
                await waitFor(() => attachBox() && !attachBox().hidden && attachBox().querySelector('img'));
                d.getElementById('chordSend').click();
                await waitFor(() => /看不了图片/.test(chordText('#viewPage .chord-card-body')));
                t('碰上看不了图的模型，说的是「换个支持图片的模型」',
                    /看不了图片/.test(chordText('#viewPage .chord-card-body')) &&
                    /gpt-4o/.test(chordText('#viewPage .chord-card-body')),
                    chordText('#viewPage .chord-card-body').slice(0, 200));
                t('这张卡还留着「再试一次」，没把人堵死',
                    !!d.querySelector('#viewPage .chord-card-body + .chord-card-acts [data-chord="retry"]') ||
                    !!d.querySelector('#viewPage [data-chord="retry"]'));

                say('== 弦音：不是图片、读不出来的，都得挡住 ==');
                w.fetch = realFetch;
                const asksBeforeBad = asks;
                feed(new w.File([new Uint8Array([1, 2, 3, 4])], 'x.heic', { type: 'image/heic' }));
                await sleep(700);
                t('读不出来的照片给一句人话',
                    /读不出来/.test(d.getElementById('toast').textContent || ''),
                    d.getElementById('toast').textContent || '');
                t('读不出来的照片不会贴上去',
                    attachBox().hidden === true);
                feed(new w.File([new Uint8Array([1, 2])], 'note.txt', { type: 'text/plain' }));
                await sleep(400);
                t('不是图片的文件直接挡住',
                    /这不是一张图片/.test(d.getElementById('toast').textContent || ''),
                    d.getElementById('toast').textContent || '');
                t('这两种都没惊动 AI', asks === asksBeforeBad, asks + ' / ' + asksBeforeBad);
                w.fetch = realFetch;

                say('== 弦音：关掉它，主页退回原样 ==');
                d.getElementById('backHomeBtn').click();
                await sleep(250);
                const railTokens = () => Array.from(d.querySelectorAll('#rail .rail-item'))
                    .map((n) => n.getAttribute('data-rail-page') || n.getAttribute('data-act'));
                const railBefore = railTokens();
                t('回主页时弦音还在竖栏里', railBefore.indexOf('assistant') >= 0, railBefore.join(','));

                d.getElementById('settingsBtn').click();
                await sleep(300);
                d.querySelector('[data-module-row="assistant"] [data-toggle]').click();
                await sleep(300);
                d.getElementById('settingsClose').click();
                await sleep(300);
                t('关掉后竖栏里弦音入口没了', railTokens().indexOf('assistant') < 0, railTokens().join(','));
                t('别的入口一个都没少',
                    railTokens().join(',') === railBefore.filter((x) => x !== 'assistant').join(','),
                    railTokens().join(','));
                t('主页还是老样子',
                    !!d.querySelector('#viewHome .wordmark') && !!d.querySelector('#viewHome .org-line') &&
                    d.getElementById('viewHome').className.indexOf('home--docked') < 0);

                d.getElementById('settingsBtn').click();
                await sleep(300);
                d.querySelector('[data-module-row="assistant"] [data-toggle]').click();
                await sleep(300);
                d.getElementById('settingsClose').click();
                await sleep(300);
                t('再打开，弦音回到竖栏原来的位置',
                    railTokens().join(',') === railBefore.join(','), railTokens().join(','));

                say('DONE');
            } catch (err) {
                say('ERROR ' + err.message);
            }
        });
    </script>
</body>
</html>
