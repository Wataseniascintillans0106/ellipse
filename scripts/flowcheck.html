<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>flow check</title>
</head>
<body style="margin:0;background:#8a8a8a">
    <iframe id="frame" src="../index.html" style="width:390px;height:844px;border:0;display:block;background:#fff"></iframe>
    <pre id="out" style="position:fixed;right:0;top:0;background:#fff;font:10px/1.4 monospace;margin:0;padding:5px;width:225px;white-space:pre-wrap"></pre>
    <script>
        const log = [];
        const say = (m) => { log.push(m); document.getElementById('out').textContent = log.join('\n'); };
        const frame = document.getElementById('frame');
        const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

        frame.addEventListener('load', async () => {
            const w = frame.contentWindow, d = frame.contentDocument;
            const t = (label, cond) => say((cond ? 'ok   ' : 'FAIL ') + label);
            try {
                say('== 主页 ==');
                t('主页可见', !d.getElementById('viewHome').hidden);
                t('设置按钮在主页显示', !d.getElementById('settingsBtn').hidden);
                t('返回按钮隐藏', d.getElementById('backHomeBtn').hidden);

                const railItems = Array.from(d.querySelectorAll('#rail .rail-item'));
                t('竖栏两个入口（波状图 + 状态记录）', railItems.length === 2,
                    String(railItems.length));
                t('上面那个是波状图、下面是状态记录',
                    railItems.length === 2 &&
                    railItems[0].getAttribute('data-rail-page') === 'trend' &&
                    railItems[1].getAttribute('data-act') === 'record');
                if (railItems.length === 2) {
                    const a = railItems[0].getBoundingClientRect();
                    const b = railItems[1].getBoundingClientRect();
                    t('波状图入口确实压在状态记录上方', a.bottom <= b.top + 1,
                        a.bottom + ' vs ' + b.top);
                }
                t('竖栏无导出按钮', !d.querySelector('#rail [data-act="export-sheet"]'));

                d.querySelector('#rail [data-act="record"]').click();
                await sleep(200);
                say('== 记录页 ==');
                t('hash=#record', w.location.hash === '#record');
                t('记录页可见', !d.getElementById('viewRecord').hidden);
                t('设置按钮仍隐藏', d.getElementById('settingsBtn').hidden);
                t('竖栏隐藏', d.getElementById('rail').hidden);
                t('返回按钮可见', !d.getElementById('backHomeBtn').hidden);

                const recordHead = d.querySelector('#viewRecord .head-line').getBoundingClientRect();
                const recordHeadLeft = recordHead.left;
                const recordHeadTop = recordHead.top;

                const recordBack = d.getElementById('backHomeBtn').getBoundingClientRect();
                t('返回按钮在标题左边',
                    recordBack.right <= recordHead.left + 1,
                    recordBack.right + ' vs ' + recordHead.left);
                t('返回按钮和标题在同一行',
                    Math.abs(recordBack.top + recordBack.height / 2 -
                        (recordHead.top + recordHead.height / 2)) <= 2,
                    (recordBack.top + recordBack.height / 2) + ' vs ' +
                        (recordHead.top + recordHead.height / 2));
                t('返回按钮是页头里的按钮（不是浮在上面的圆形角标）',
                    !!d.querySelector('#viewRecord .head-row > #backHomeBtn'));

                const cards = Array.from(d.querySelectorAll('#moduleStack .module'));
                say('栏: ' + cards.map((c) => c.dataset.module).join(','));
                t('记录页最后一张是日记', cards.length > 0 &&
                    cards[cards.length - 1].dataset.module === 'diary');
                t('记录页里没有波状图卡片', cards.every((c) => c.dataset.module !== 'trend'));

                const offCenter = cards.filter((card) => {
                    const prev = card.querySelector('.module-preview');
                    if (!prev) return false;
                    const hr = card.querySelector('.module-head').getBoundingClientRect();
                    const pr = prev.getBoundingClientRect();
                    const cr = card.getBoundingClientRect();
                    const pcs = w.getComputedStyle(prev);
                    const border = parseFloat(w.getComputedStyle(card).borderBottomWidth) || 0;
                    const above = (pr.top + parseFloat(pcs.paddingTop)) - hr.bottom;
                    const below = (cr.bottom - border) - (pr.bottom - parseFloat(pcs.paddingBottom));
                    return Math.abs(above - below) > 1;
                }).map((c) => c.dataset.module);
                t('收起的小字上下留白一致（垂直居中）', offCenter.length === 0, offCenter.join(','));

                d.querySelector('.export-card').click();
                await sleep(300);
                d.getElementById('sheetClose').click();
                await sleep(400);
                t('面板自身关闭按钮有效', !d.getElementById('sheet').classList.contains('open'));

                const card = (id) => d.querySelector('.module[data-module="' + id + '"]');
                const isOpen = (id) => !!card(id) && card(id).classList.contains('is-open');
                const clickHead = (id) => card(id).querySelector('.module-head').click();

                const moodWas = isOpen('mood');
                clickHead('mood');
                await sleep(200);
                t('情绪栏点标题栏翻转展开状态', isOpen('mood') !== moodWas);
                clickHead('mood');
                await sleep(200);
                t('再点一次回到原状', isOpen('mood') === moodWas);

                say('== 波状图页（从主页竖栏进） ==');
                d.getElementById('backHomeBtn').click();
                await sleep(400);
                t('回到主页', !d.getElementById('viewHome').hidden);

                d.querySelector('#rail [data-rail-page="trend"]').click();
                await sleep(300);
                t('hash=#page/trend', w.location.hash === '#page/trend', w.location.hash);
                t('波状图页可见', !d.getElementById('viewPage').hidden);
                t('记录页已隐藏', d.getElementById('viewRecord').hidden);
                t('主页已隐藏', d.getElementById('viewHome').hidden);
                t('竖栏隐藏', d.getElementById('rail').hidden);
                t('返回按钮可见', !d.getElementById('backHomeBtn').hidden);
                t('设置按钮隐藏（设置只在主页）', d.getElementById('settingsBtn').hidden);

                const pageBody = d.getElementById('pageBody');
                t('标题是「状态波动图」', d.getElementById('pageTitle').textContent === '状态波动图',
                    d.getElementById('pageTitle').textContent);
                t('三个区间按钮', pageBody.querySelectorAll('.range-btn').length === 3);
                const charts = pageBody.querySelectorAll('.chart-block');
                t('出图 4 个模块', charts.length === 4);
                say('图: ' + Array.from(charts).map((c) => c.dataset.module + '(' +
                    c.querySelectorAll('svg').length + ')').join(' '));
                const moodSvgs = pageBody.querySelector('.chart-block[data-module="mood"]')
                    .querySelectorAll('svg').length;
                say('情绪 SVG 数=' + moodSvgs);
                t('情绪至少 3 张图', moodSvgs >= 3);
                t('最下面有一行小字说明', (d.getElementById('pageNote').textContent || '').length > 4,
                    d.getElementById('pageNote').textContent);

                const pageHead = d.getElementById('pageTitle').getBoundingClientRect();
                t('标题的左边缘和记录页标题对齐',
                    Math.abs(pageHead.left - recordHeadLeft) <= 1,
                    pageHead.left + ' vs ' + recordHeadLeft);
                t('标题的顶边和记录页标题对齐（同样的顶部留白）',
                    Math.abs(pageHead.top - recordHeadTop) <= 1,
                    pageHead.top + ' vs ' + recordHeadTop);

                const rangeRow = pageBody.querySelector('.range-row').getBoundingClientRect();
                const lastChart = charts[charts.length - 1].getBoundingClientRect();
                const noteRect = d.getElementById('pageNote').getBoundingClientRect();
                t('区间按钮排在标题下面', rangeRow.top >= pageHead.bottom - 1,
                    rangeRow.top + ' vs ' + pageHead.bottom);
                t('小字排在所有图的下面', noteRect.top >= lastChart.bottom - 1,
                    noteRect.top + ' vs ' + lastChart.bottom);
                const firstChart = charts[0].getBoundingClientRect();
                t('曲线块与区间按钮左右对齐',
                    Math.abs(firstChart.left - rangeRow.left) <= 1,
                    firstChart.left + ' vs ' + rangeRow.left);
                t('返回按钮在这一页也在标题左边、同一行',
                    d.getElementById('backHomeBtn').getBoundingClientRect().right <= pageHead.left + 1 &&
                    Math.abs(d.getElementById('backHomeBtn').getBoundingClientRect().top +
                        d.getElementById('backHomeBtn').getBoundingClientRect().height / 2 -
                        (pageHead.top + pageHead.height / 2)) <= 2);

                t('这一页比一屏高、能上下滑',
                    d.getElementById('viewPage').scrollHeight > w.innerHeight,
                    d.getElementById('viewPage').scrollHeight + ' vs ' + w.innerHeight);

                const beforeRange = pageBody.querySelector('.range-btn.on').textContent;
                pageBody.querySelectorAll('.range-btn')[0].click();
                await sleep(200);
                t('点区间按钮后选中态跟着切',
                    pageBody.querySelector('.range-btn.on').textContent !== beforeRange,
                    beforeRange + ' -> ' + pageBody.querySelector('.range-btn.on').textContent);
                t('切完还是同一个页面', !d.getElementById('viewPage').hidden);

                d.getElementById('backHomeBtn').click();
                await sleep(400);
                t('从波状图页返回主页', !d.getElementById('viewHome').hidden);

                say('== 导出面板 ==');
                d.querySelector('#rail [data-act="record"]').click();
                await sleep(300);
                d.querySelector('.export-card').click();
                await sleep(300);
                t('面板已打开', d.getElementById('sheet').classList.contains('open'));
                t('返回按钮让位隐藏', d.getElementById('backHomeBtn').hidden);
                t('body 锁定', d.body.classList.contains('is-locked'));
                d.getElementById('backHomeBtn').click();
                await sleep(400);
                t('面板自身关闭按钮有效', !d.getElementById('sheet').classList.contains('open'));
                t('关闭后返回按钮恢复', !d.getElementById('backHomeBtn').hidden);
                t('仍在记录页', !d.getElementById('viewRecord').hidden);

                d.querySelector('.export-card').click();
                await sleep(300);
                d.getElementById('backHomeBtn').click();
                await sleep(300);
                d.getElementById('backHomeBtn').click();
                await sleep(400);
                t('再点返回回到主页', !d.getElementById('viewHome').hidden);
                t('主页上设置按钮恢复', !d.getElementById('settingsBtn').hidden);

                say('== 设置里关闭波状图 ==');
                d.getElementById('settingsBtn').click();
                await sleep(200);
                const trendRow = d.querySelector('[data-module-row="trend"] [data-toggle]');
                t('设置里有波状图开关', !!trendRow);
                t('页面型模块不给排序按钮，也说明了入口在哪',
                    d.querySelectorAll('[data-module-row="trend"] [data-order]').length === 0 &&
                    /入口在主页右侧栏/.test(
                        d.querySelector('[data-module-row="trend"] .set-row-desc').textContent));
                trendRow.click();
                await sleep(200);
                d.getElementById('settingsClose').click();
                await sleep(250);
                t('关掉后竖栏里的波状图入口消失',
                    !d.querySelector('#rail [data-rail-page="trend"]'));
                t('状态记录入口还在', !!d.querySelector('#rail [data-act="record"]'));
                say('DONE');
            } catch (err) {
                say('ERROR ' + err.message);
            }
        });
    </script>
</body>
</html>
